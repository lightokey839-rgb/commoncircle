name: CommonCircle Gate 0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-loanbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  circle-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - name: Build the Gate 0 scaffold
        run: cargo test --manifest-path contracts/circle/Cargo.toml --no-run
      - name: Run the expected Gate 0 red tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path contracts/circle/Cargo.toml --no-fail-fast
          status=$?
          set -e
          test "$status" -ne 0

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/claims-self-test.mjs
      - run: node scripts/claims.mjs
      - run: git diff --exit-code -- README.md EVIDENCE.md
