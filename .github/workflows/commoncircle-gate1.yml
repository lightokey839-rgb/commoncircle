name: CommonCircle Gate 1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEAR_MAINNET_RPC_URL: ${{ vars.NEAR_MAINNET_RPC_URL || 'https://free.rpc.fastnear.com' }}
  NEAR_TESTNET_RPC_URL: ${{ vars.NEAR_TESTNET_RPC_URL || 'https://test.rpc.fastnear.com' }}

jobs:
  contracts:
    name: Rust build, unit tests, and near-workspaces sandbox
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Toolchain comes from rust-toolchain.toml (1.99.1 + wasm32 target).
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Prebuilt release binary; building cargo-near from source needs libudev.
      - name: Install cargo-near 0.23.0 (prebuilt release)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo-near" near --version || true
      - name: Prepare log directory
        run: mkdir -p ../artifacts
      - name: Build wasm (cargo-near) and record sha256
        run: |
          set -o pipefail
          ./scripts/build-wasm.sh 2>&1 | tee ../artifacts/wasm-build.log
      - name: Unit tests
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -o pipefail
          cargo test --workspace --lib --no-fail-fast 2>&1 | tee ../artifacts/unit-tests.log
      - name: Sandbox starts
        run: |
          set -o pipefail
          cargo test -p commoncircle-sandbox-check 2>&1 | tee ../artifacts/sandbox-check.log
      - name: F0 sandbox scenarios (refund proofs)
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -o pipefail
          cargo test -p commoncircle-circle --test sandbox_f0 --no-fail-fast -- --test-threads=4 2>&1 | tee ../artifacts/sandbox-f0.log
      - name: Red-team tests (known-issue tests assert current behaviour)
        continue-on-error: true
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -o pipefail
          cargo test -p commoncircle-circle --test redteam --no-fail-fast -- --test-threads=4 2>&1 | tee ../artifacts/redteam.log
      - name: README checks (rows for later gates are expected to stay red)
        continue-on-error: true
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -o pipefail
          cargo test -p commoncircle-circle --test readme_checks --no-fail-fast -- --test-threads=4 2>&1 | tee ../artifacts/readme-checks.log
      - name: Sputnik DAO treasury loans (Gate 2; testnet global-hash Sputnik code)
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -o pipefail
          cargo test -p commoncircle-circle --test sandbox_sputnik --no-fail-fast -- --test-threads=2 --nocapture 2>&1 | tee ../artifacts/sandbox-sputnik.log
      - name: Upload Rust logs and wasm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commoncircle-rust-logs
          path: |
            artifacts/
            contracts/Cargo.lock
            contracts/target/near-wasm/*.wasm
          if-no-files-found: warn

  reproducible-wasm:
    name: Reproducible circle wasm (Docker, cargo-near)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: contracts/circle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-near 0.23.0 (prebuilt release)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build reproducible wasm and record hashes
        run: |
          set -o pipefail
          mkdir -p ../../artifacts
          cargo near build reproducible-wasm --out-dir ../../artifacts/reproducible 2>&1 | tee ../../artifacts/reproducible-build.log
          sha256sum ../../artifacts/reproducible/*.wasm | tee ../../artifacts/reproducible-sha256.txt
          python3 - <<'PY' | tee ../../artifacts/reproducible-code-hash.txt
          import hashlib, glob
          A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          for p in glob.glob("../../artifacts/reproducible/*.wasm"):
              n = int.from_bytes(hashlib.sha256(open(p, "rb").read()).digest(), "big")
              s = ""
              while n:
                  n, r = divmod(n, 58)
                  s = A[r] + s
              print(p.split("/")[-1], "code_hash(base58) =", s)
          PY
      - name: F0 refund proofs against the reproducible wasm (the deploy artifact)
        working-directory: contracts
        run: |
          set -o pipefail
          ./scripts/build-wasm.sh > /dev/null   # mock-ft for the sandbox
          CIRCLE_WASM="$GITHUB_WORKSPACE/artifacts/reproducible/commoncircle_circle.wasm"             cargo test -p commoncircle-circle --test sandbox_f0 --no-fail-fast -- --test-threads=4 2>&1 | tee ../artifacts/reproducible-sandbox-f0.log
      - name: README rows against the reproducible wasm (later-gate rows stay red)
        continue-on-error: true
        working-directory: contracts
        run: |
          set -o pipefail
          CIRCLE_WASM="$GITHUB_WORKSPACE/artifacts/reproducible/commoncircle_circle.wasm"             cargo test -p commoncircle-circle --test readme_checks --no-fail-fast -- --test-threads=4 2>&1 | tee ../artifacts/reproducible-readme-checks.log
      - name: Upload reproducible wasm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commoncircle-reproducible-wasm
          path: artifacts/
          if-no-files-found: warn

  javascript:
    name: npm tests, claims, and USDC verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare log directory
        run: mkdir -p artifacts
      - name: Clean npm install
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee artifacts/npm-ci.log
      - name: Typecheck web, server and tests
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/typecheck.log
      - name: Lint web, server and tests
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint.log
      - name: Run npm tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/npm-test.log
      - name: Chat server on PostgreSQL (store tests + real server restart)
        shell: bash
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee artifacts/test-db.log
      - name: Build web app
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/build.log
      - name: Run claims self-test
        shell: bash
        run: |
          set -o pipefail
          npm run claims:test 2>&1 | tee artifacts/claims-test.log
      - name: Run claims harness
        shell: bash
        run: |
          set -o pipefail
          npm run claims 2>&1 | tee artifacts/claims.log
      - name: Online claims (F-05) - re-read every evidence row from testnet, then check
        shell: bash
        run: |
          set -o pipefail
          node contracts/scripts/build-evidence.mjs 2>&1 | tee artifacts/claims-online-build.log
          npm run claims 2>&1 | tee artifacts/claims-online.log
          cp -r evidence/snapshots artifacts/online-snapshots
      - name: Verify pinned USDC contracts from A6 RPC variables
        shell: bash
        run: |
          set -o pipefail
          npm run verify:usdc 2>&1 | tee artifacts/verify-usdc.log
      - name: Upload JavaScript logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commoncircle-javascript-logs
          path: artifacts/
          if-no-files-found: warn

  secrets:
    name: Full-history gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full Git history with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --verbose --log-format json --log-file gitleaks.json
      - name: Upload gitleaks log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commoncircle-gitleaks-log
          path: gitleaks.json
          if-no-files-found: warn
